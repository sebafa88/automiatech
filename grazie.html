<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messaggio inviato · AutomIA</title>
  <meta name="robots" content="noindex">


  <link rel="stylesheet" href="fonts/inter.css">

  <script>
    (function() {
      if (localStorage.getItem('cookie-choice') === 'accepted') {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-0TFQWDM4DE';
        s.onload = function() {
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', 'G-0TFQWDM4DE');
          gtag('event', 'form_submit', {
            event_category: 'lead',
            event_label: 'contatto_principale',
            value: 1
          });
        };
        document.head.appendChild(s);
      }
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #2563EB;
      --dark: #0F172A;
      --charcoal: #1E293B;
      --gray: #64748B;
      --border: #E2E8F0;
      --white: #FFFFFF;
    }
    body {
      font-family: 'Inter', sans-serif;
      color: var(--charcoal);
      background: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      background: #EFF6FF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 12px;
      color: var(--dark);
    }
    p {
      color: var(--gray);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: var(--blue);
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 14px 28px;
      border-radius: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.88; }
    .note {
      margin-top: 24px;
      font-size: 0.82rem;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Messaggio ricevuto.</h1>
    <p>Grazie per avermi scritto. Ti rispondo entro 24 ore — io direttamente, senza intermediari.</p>
    <a href="index.html" class="btn">Torna al sito →</a>
    <p class="note">Nel frattempo puoi scrivermi su WhatsApp se è urgente.</p>
  </div>
</body>
</html>
